---
- name: Require explicit strong environment values
  ansible.builtin.assert:
    that:
      - shopflow_postgres_password is match('^[A-Za-z0-9]{24,}$')
      - shopflow_redis_password is match('^[A-Za-z0-9]{24,}$')
      - shopflow_jwt_secret is match('^[A-Za-z0-9]{32,}$')
      - shopflow_grafana_password is match('^[A-Za-z0-9]{24,}$')
    fail_msg: Generate random alphanumeric secrets before deploying.
  no_log: true

- name: Clone the selected ShopFlow revision as deployment user
  ansible.builtin.git:
    repo: "{{ shopflow_repo }}"
    dest: "{{ shopflow_dir }}"
    version: "{{ shopflow_version }}"
    force: false
  become_user: "{{ shopflow_user }}"
  register: shopflow_checkout

- name: Configure private environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ shopflow_dir }}/.env"
    owner: "{{ shopflow_user }}"
    mode: '0600'
  no_log: true

- name: Start database, cache and backend
  community.docker.docker_compose_v2:
    project_src: "{{ shopflow_dir }}"
    services: [postgres, redis, backend]
    build: "{{ 'always' if shopflow_checkout.changed else 'policy' }}"
    state: present
    wait: true
    wait_timeout: 180

- name: Verify backend HTTP readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/health
    status_code: 200
  register: shopflow_ready
  until: shopflow_ready.status | default(0) == 200
  retries: 30
  delay: 2

- name: Initialize missing database tables
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, backend, python, -m, app.init_db]
    chdir: "{{ shopflow_dir }}"
  changed_when: false

- name: Seed missing demo products
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, backend, python, -m, app.seed]
    chdir: "{{ shopflow_dir }}"
  register: shopflow_seed
  changed_when: "'Added 0 missing demo products' not in shopflow_seed.stdout"

- name: Start selected application services
  community.docker.docker_compose_v2:
    project_src: "{{ shopflow_dir }}"
    services: "{{ shopflow_services }}"
    build: "{{ 'always' if shopflow_checkout.changed else 'policy' }}"
    state: present
    wait: true
    wait_timeout: 180

- name: Verify the reverse proxy
  ansible.builtin.uri:
    url: http://127.0.0.1/api/health
    status_code: 200
  register: shopflow_proxy
  until: shopflow_proxy.status | default(0) == 200
  retries: 15
  delay: 2
